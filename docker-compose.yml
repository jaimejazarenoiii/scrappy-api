services:
  postgres:
    image: postgres:16-alpine
    container_name: scrappy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scrappy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scrappy']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrappy-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scrappy?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

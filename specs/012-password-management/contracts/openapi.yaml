openapi: 3.0.3
info:
  title: Scrappy API — Password Management
  version: 1.0.0
  description: >
    P003 addendum contracts for change password, admin password reset with system-generated
    one-time temporary password, and password status. Email forgot-password is out of scope.
servers:
  - url: /api/v1
tags:
  - name: Users
  - name: Employees
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [success, data, meta, error]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object }
        meta: { type: object, additionalProperties: true }
        error: { nullable: true, type: 'null' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
        confirmPassword: { type: string, minLength: 8 }
    PasswordStatusResponse:
      type: object
      required: [passwordChangeRequired]
      properties:
        passwordChangeRequired: { type: boolean }
        passwordChangedAt: { type: string, format: date-time, nullable: true }
    ResetEmployeePasswordResponse:
      type: object
      required: [employeeId, userId, passwordChangeRequired, temporaryPassword]
      properties:
        employeeId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        passwordChangeRequired: { type: boolean, enum: [true] }
        temporaryPassword:
          type: string
          description: >
            System-generated temporary password returned only once in this response.
            Not recoverable afterward. Administrator must communicate it securely out of band.
paths:
  /users/me/password:
    post:
      tags: [Users]
      summary: Change own password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example:
              currentPassword: password123
              newPassword: newpass123
              confirmPassword: newpass123
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '400': { description: Validation or incorrect current password }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /users/me/password-status:
    get:
      tags: [Users]
      summary: Get password status
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Password status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '401': { description: Unauthenticated }
  /employees/{employeeId}/password-reset:
    post:
      tags: [Employees]
      summary: Admin reset employee password (system-generated temporary)
      description: >
        Generates a secure temporary password, sets it as the User credential, sets
        passwordChangeRequired=true, invalidates previous credentials, and returns the temporary
        password only once. Manager may reset Employees only; Owner may reset Employee, Manager,
        or Owner (linked) in the same company. Clients must not send a temporary password.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Password reset; one-time temporaryPassword included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden role or target }
        '404': { description: Employee not found }
        '409': { description: No linked user or inactive }

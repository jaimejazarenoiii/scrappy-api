openapi: 3.0.3
info:
  title: Scrappy API - Trip Management (P006)
  version: 1.0.0
  description: |
    P006 Trip Management contracts. Trips coordinate field operations for Outside transactions.
    Managers and Owners manage trips; Employees view assigned trips only.

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TripStatus:
      type: string
      enum: [DRAFT, STARTED, COMPLETED, CANCELLED]

    TripMemberRole:
      type: string
      enum: [DRIVER, HELPER, BUYER, SUPERVISOR]

    TripNumber:
      type: string
      pattern: '^TRIP-\d{8}-\d{6}$'
      example: TRIP-20260708-000001

    TripMember:
      type: object
      required: [id, tripId, employeeId, role]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/TripMemberRole' }
        firstName: { type: string, description: Enriched on detail responses }
        lastName: { type: string }
        employeeNumber: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VehicleSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        plateNumber: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [AVAILABLE, IN_USE, MAINTENANCE, INACTIVE] }

    TripSummary:
      type: object
      required: [id, companyId, tripNumber, vehicleId, status, scheduledStart, origin, destination]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        tripNumber: { $ref: '#/components/schemas/TripNumber' }
        vehicleId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        scheduledStart: { type: string, format: date-time }
        actualStart: { type: string, format: date-time, nullable: true }
        actualEnd: { type: string, format: date-time, nullable: true }
        origin: { type: string }
        destination: { type: string }
        memberCount: { type: integer }
        vehicle: { $ref: '#/components/schemas/VehicleSummary' }

    TripDetail:
      allOf:
        - { $ref: '#/components/schemas/TripSummary' }
        - type: object
          properties:
            notes: { type: string, nullable: true }
            members:
              type: array
              items: { $ref: '#/components/schemas/TripMember' }
            linkedTransactionCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    CreateTripRequest:
      type: object
      required: [vehicleId, scheduledStart, origin, destination]
      properties:
        vehicleId: { type: string, format: uuid }
        scheduledStart: { type: string, format: date-time }
        origin: { type: string, maxLength: 500 }
        destination: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
        members:
          type: array
          items:
            type: object
            required: [employeeId, role]
            properties:
              employeeId: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/TripMemberRole' }

    UpdateTripRequest:
      type: object
      minProperties: 1
      properties:
        vehicleId: { type: string, format: uuid }
        scheduledStart: { type: string, format: date-time }
        origin: { type: string, maxLength: 500 }
        destination: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000, nullable: true }

    AddTripMemberRequest:
      type: object
      required: [employeeId, role]
      properties:
        employeeId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/TripMemberRole' }

    UpdateTripMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/TripMemberRole' }

    StartTripRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    CompleteTripRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    CancelTripRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    ArchiveTripRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

paths:
  /trips:
    post:
      tags: [Trips]
      summary: Create Draft trip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
      responses:
        '201':
          description: Trip created with Trip Number
    get:
      tags: [Trips]
      summary: List company trips (Manager/Owner)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [scheduledStart, createdAt, tripNumber] } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: tripNumber, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Paginated trip summaries

  /trips/mine:
    get:
      tags: [Trips]
      summary: List trips assigned to authenticated Employee
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
      responses:
        '200':
          description: Paginated assigned trips

  /trips/by-number/{tripNumber}:
    get:
      tags: [Trips]
      summary: Get trip by Trip Number
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripNumber, in: path, required: true, schema: { $ref: '#/components/schemas/TripNumber' } }
      responses:
        '200':
          description: Trip detail

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Get trip detail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Trip detail with members
    patch:
      tags: [Trips]
      summary: Update Draft trip header
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTripRequest' }
      responses:
        '200':
          description: Updated trip

  /trips/{tripId}/archive:
    post:
      tags: [Trips]
      summary: Archive Completed or Cancelled trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveTripRequest' }
      responses:
        '200':
          description: Archived trip

  /trips/{tripId}/start:
    post:
      tags: [Trip Status]
      summary: Start Draft trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTripRequest' }
      responses:
        '200':
          description: Trip Started

  /trips/{tripId}/complete:
    post:
      tags: [Trip Status]
      summary: Complete Started trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteTripRequest' }
      responses:
        '200':
          description: Trip Completed

  /trips/{tripId}/cancel:
    post:
      tags: [Trip Status]
      summary: Cancel Draft trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTripRequest' }
      responses:
        '200':
          description: Trip Cancelled

  /trips/{tripId}/members:
    post:
      tags: [Trip Members]
      summary: Add member to Draft trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTripMemberRequest' }
      responses:
        '201':
          description: Member added

  /trips/{tripId}/members/{memberId}:
    patch:
      tags: [Trip Members]
      summary: Update member role on Draft trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTripMemberRequest' }
      responses:
        '200':
          description: Member updated
    delete:
      tags: [Trip Members]
      summary: Remove member from Draft trip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Member removed

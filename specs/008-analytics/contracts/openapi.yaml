        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: vehicleId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Trip analytics
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /analytics/expenses:
    get:
      tags: [Analytics]
      summary: Expense analytics dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: vehicleId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Expense analytics
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /analytics/workforce:
    get:
      tags: [Analytics]
      summary: Workforce analytics dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string

  /analytics/organization:
    get:
      tags: [Analytics]
      summary: Organization analytics dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
        - name: from
          in: query

openapi: 3.0.3
info:
  title: Scrappy API
  version: 1.0.0
  description: Company & Identity Foundation contracts for tenant onboarding, authentication, users, and employees.

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [success, data, meta, error]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        meta:
          type: object
          additionalProperties: true
        error:
          nullable: true
          type: 'null'
    ApiErrorEnvelope:
      type: object
      required: [success, data, meta, error]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
          type: 'null'
        meta:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    Company:
      type: object
      required: [id, name, displayName, status]
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    User:
      type: object
      required: [id, companyId, email, role, status]
      properties:
        id: { type: string }
        companyId: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [OWNER, MANAGER, EMPLOYEE] }
        status: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
    Employee:
      type: object
      required: [id, companyId, firstName, lastName, role, status]
      properties:
        id: { type: string }
        companyId: { type: string }
        employeeCode: { type: string, nullable: true }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string }
        role: { type: string, enum: [OWNER, MANAGER, EMPLOYEE] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        userId: { type: string, nullable: true }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, companyId, userId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        companyId: { type: string }
        userId: { type: string }
    CreateCompanyRequest:
      type: object
      required: [name, displayName, ownerFullName, ownerEmail, ownerPassword]
      properties:
        name: { type: string }
        displayName: { type: string }
        ownerFullName: { type: string }
        ownerEmail: { type: string, format: email }
        ownerPassword: { type: string }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string }
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, role]
      properties:
        employeeCode: { type: string }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [MANAGER, EMPLOYEE] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    UpdateEmployeeRequest:
      type: object
      properties:
        employeeCode: { type: string }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [MANAGER, EMPLOYEE] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    LinkEmployeeUserRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

security:
  - bearerAuth: []

paths:
  /companies:
    post:
      tags: [Company]
      summary: Create Company and initial Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company and Owner created
        '400': { description: Validation error }
        '409': { description: Duplicate company or owner }
  /companies/{companyId}:
    get:
      tags: [Company]
      summary: View Company
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Company retrieved }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden or cross-company access }
        '404': { description: Company not found }
    patch:
      tags: [Company]
      summary: Update Company
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Company updated }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Company not found }
  /companies/{companyId}/archive:
    post:
      tags: [Company]
      summary: Archive Company
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Company archived }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Company not found }
        '409': { description: Invalid lifecycle transition }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Authenticated session created }
        '400': { description: Validation error }
        '401': { description: Invalid credentials }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      responses:
        '200': { description: Logout success }
        '401': { description: Unauthenticated }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': { description: Session refreshed }
        '401': { description: Invalid or expired refresh context }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Forgot password placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202': { description: Recovery request accepted }
        '400': { description: Validation error }
  /users/me:
    get:
      tags: [Users]
      summary: View current user identity
      responses:
        '200': { description: Current user retrieved }
        '401': { description: Unauthenticated }
  /employees:
    post:
      tags: [Employees]
      summary: Create Employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201': { description: Employee created }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '409': { description: Duplicate employee identity }
  /employees/{employeeId}:
    get:
      tags: [Employees]
      summary: View Employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Employee retrieved }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden or cross-company access }
        '404': { description: Employee not found }
    patch:
      tags: [Employees]
      summary: Update Employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200': { description: Employee updated }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Employee not found }
  /employees/{employeeId}/archive:
    post:
      tags: [Employees]
      summary: Archive Employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Employee archived }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
        '404': { description: Employee not found }
        '409': { description: Invalid lifecycle transition }
  /employees/{employeeId}/user-link:
    post:
      tags: [Employees]
      summary: Link Employee to User
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkEmployeeUserRequest'
      responses:
        '200': { description: Employee linked to user }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden or cross-company mismatch }
        '404': { description: Employee or user not found }
        '409': { description: Invalid linkage state }
